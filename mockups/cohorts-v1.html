<!doctype html>
<html lang="en"><head><meta charset="utf-8"/>
<title>Player retention cohorts — vGrowth</title>
<style>
:root{
  --forest:#003326;--ink:#0d1f18;--muted:#5C6B62;--cream:#F4EEE1;--paper:#fff;
  --line:#dfe4da;--slot:#EFF4EF;--mint:#2CDB87;
  --above:#d9f8ea;--aboveInk:#0A5C3E;
  --at:#fff1bd;--atInk:#7A5200;
  --below:#fde4e1;--belowInk:#A02F22;
}
*{box-sizing:border-box}
body{margin:0;padding:24px;background:var(--cream);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
  color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:1800px;margin:0 auto}
.card{background:var(--paper);border:1px solid var(--line);border-radius:16px;
  box-shadow:0 9px 26px rgba(0,51,38,.075);overflow:hidden}

.head{display:flex;justify-content:space-between;align-items:flex-start;gap:24px;padding:18px 22px}
.title{font-size:16px;font-weight:900;letter-spacing:-.2px;color:var(--forest)}
.sub{font-size:12px;color:var(--muted);margin-top:5px;max-width:820px;line-height:1.45}
.controls{display:flex;align-items:flex-end;gap:12px}
.fld label{display:block;font-size:9px;font-weight:900;letter-spacing:.8px;text-transform:uppercase;
  color:var(--muted);margin-bottom:5px}
select{font-family:inherit;font-size:12px;font-weight:750;color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:10px;padding:9px 12px;cursor:pointer;min-width:132px}
.btn{border:0;background:var(--forest);color:#fff;font-size:12px;font-weight:850;
  padding:11px 20px;border-radius:10px;cursor:pointer;font-family:inherit}
.btn:hover{background:#00281e}

.key{display:flex;gap:22px;padding:11px 22px;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);background:#fff}
.key span{font-size:10.5px;font-weight:800;color:var(--ink);display:inline-flex;align-items:center}
.key i{display:inline-block;width:13px;height:13px;border-radius:4px;margin-right:8px}

/* The table scrolls inside the card rather than growing the page to 41 rows.
   The sticky header and average bar pin to THIS container, so both stay in
   view while you scroll cohorts. */
.scroll{overflow:auto;max-height:min(68vh,640px)}
table{width:100%;border-collapse:collapse;table-layout:fixed}
th,td{padding:0;text-align:center;font-variant-numeric:tabular-nums}
/* 41 rows means the header and the averages both scroll away. Pin them: the
   column you are reading and the average you are comparing against have to
   stay on screen or the heat colours mean nothing. */
thead th{font-size:9.5px;font-weight:900;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);
  padding:12px 6px;background:#fff;border-bottom:1px solid var(--line);white-space:nowrap;
  position:sticky;top:0;z-index:3}
th.cohort-h,td.cohort-c{text-align:left;width:190px;padding-left:22px;padding-right:12px}
.cell{padding:14px 6px;font-size:12.5px;font-weight:850;border-bottom:1px solid rgba(255,255,255,.85)}
.cell.above{background:var(--above);color:var(--aboveInk)}
.cell.at{background:var(--at);color:var(--atInk)}
.cell.below{background:var(--below);color:var(--belowInk)}
.cell.none{background:#fafbf9;color:#67736C;font-weight:700}
td.cohort-c{padding-top:11px;padding-bottom:11px;border-bottom:1px solid var(--line);background:#fff}
.cname{font-size:12.5px;font-weight:900;color:var(--forest);background:none;border:0;padding:0;
  cursor:pointer;font-family:inherit}
.cname:hover{text-decoration:underline}
.cmeta{font-size:10.5px;color:var(--muted);font-weight:650;margin-top:3px}
.freebadge{display:inline-block;margin-left:7px;font-size:8.5px;font-weight:900;letter-spacing:.4px;
  text-transform:uppercase;background:var(--slot);border:1px solid var(--line);color:var(--muted);
  border-radius:5px;padding:1px 6px;vertical-align:1px}
tbody tr.open td.cohort-c{background:var(--slot)}

tfoot td{background:var(--forest);color:#fff;font-size:12.5px;font-weight:900;
  border:0;position:sticky;bottom:0;z-index:3;height:50px;padding:0 6px}
tfoot td.cohort-c{background:var(--forest);color:#fff;text-align:left;font-weight:900}

tfoot .flabel{font-size:12.5px;font-weight:900;display:block}
tfoot .fsub{font-size:10.5px;font-weight:700;opacity:.85}

/* City breakdown expands in place, directly under the cohort you clicked, inside
   the scrolling table — so the split stays anchored to its row. */
.detail > td{background:var(--slot);border-bottom:1px solid var(--line);padding:0}
.detail-inner{padding:16px 22px 20px;text-align:left}
.detail-head{display:flex;justify-content:flex-start;align-items:flex-start;gap:20px;margin-bottom:12px}
.detail-head > div:first-child{flex:1}
.detail-head strong{font-size:15px;font-weight:900;color:var(--forest)}
.detail-sub{font-size:11.5px;color:var(--muted);font-weight:650;margin-top:4px}
.close{border:1px solid var(--line);background:#fff;color:var(--ink);font-size:12px;font-weight:850;
  border-radius:10px;padding:9px 20px;cursor:pointer;font-family:inherit;white-space:nowrap}
.close:hover{background:var(--slot)}
.dwrap{background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
table.dt{width:100%;border-collapse:collapse;table-layout:fixed}
table.dt th{font-size:9px;font-weight:900;letter-spacing:.6px;text-transform:uppercase;
  color:var(--muted);padding:11px 5px;background:#fff;border-bottom:1px solid var(--line);
  text-align:right;position:static}
table.dt td{font-size:12px;font-weight:750;color:var(--ink);padding:12px 5px;text-align:right;
  border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
table.dt th.dcity,table.dt td.dcity{text-align:left;width:170px;padding-left:18px;font-weight:900}
table.dt th.dsize,table.dt td.dsize{width:110px;padding-right:18px}
table.dt tbody tr:last-child td{border-bottom:1px solid var(--line)}
table.dt tfoot td{background:#eef3ef;color:var(--forest);font-weight:900;border-bottom:0}
table.dt .dnone{color:#67736C;font-weight:700}
.dnote{font-size:11px;color:var(--muted);line-height:1.55;margin-top:11px;max-width:1000px}
.dnote b{color:var(--ink);font-weight:800}

.foot{padding:14px 22px 18px;font-size:11px;color:var(--muted);line-height:1.6;max-width:1100px}
.foot b{color:var(--ink);font-weight:800}
.foot + .foot{padding-top:0}
</style></head>
<body><div class="wrap"><div class="card">

  <div class="head">
    <div>
      <div class="title">Player retention cohorts</div>
      <div class="sub">Filter by year, month and city. Click a cohort name for city detail; click a retention cell to see the Player IDs that churned from the prior month.</div>
    </div>
    <div class="controls">
      <div class="fld"><label>Cohort year</label><select id="cohortYear"></select></div>
      <div class="fld"><label>Cohort month</label><select id="cohortMonth"></select></div>
      <div class="fld"><label>City</label><select id="cohortCity"></select></div>
      <button class="btn" id="cohortExport">Export</button>
    </div>
  </div>

  <div class="key">
    <span><i style="background:var(--above)"></i>Above column average</span>
    <span><i style="background:var(--at)"></i>At column average (±2pp)</span>
    <span><i style="background:var(--below)"></i>Below column average</span>
  </div>

  <div class="scroll">
    <table id="grid">
      <thead id="gridHead"></thead>
      <tbody id="gridBody"></tbody>
      <tfoot id="gridFoot"></tfoot>
    </table>
  </div>

  <div class="foot" id="note1"></div>
  <div class="foot" id="note2"></div>

</div></div>

<script>
/* ── cohorts ───────────────────────────────────────────────────────────────
   One cohort per month from the first match ever through the current month.
   Ages run 0..12 in this table; the retention CURVE runs the full history.  */
const FIRST = "2023-04", NOW = "2026-08", MAXCOL = 12;
const MN = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const idx = s => { const [y,m] = s.split("-").map(Number); return y*12 + (m-1); };
const lbl = i => `${MN[i%12]} ${Math.floor(i/12)}`;
const I0 = idx(FIRST), I1 = idx(NOW);
const N = I1 - I0 + 1;                                   // 41 cohorts

/* Apr and May 2023 were free. They are shown but excluded from the averages. */
const FREE = new Set([idx("2023-04"), idx("2023-05")]);

const SIZES = (() => {
  const out = [];
  for(let i=0;i<N;i++){
    const t = i/(N-1);
    out.push(Math.round(38 + 1085*Math.pow(t,2.35) + ((i*53)%37)*3));
  }
  out[N-1] = 181;                                        // current month, part-way through
  return out;
})();

const BASE = [100,36,27,21,20,18.5,17.7,17,16,15.5,15,14.5,13.5];
/* Deterministic per-cohort variation — no randomness, so the harness can
   recompute every cell independently. Two parts: a trend (older cohorts
   retained better, which is what the real data shows) and per-cohort noise,
   sized so cohorts land meaningfully either side of the column mean rather
   than all clustering inside the 2pp "at average" band. */
const jitter = (i,a) => {
  const trend = 0.22 * (1 - 2*i/(N-1));          // +22% oldest, -22% newest
  const noise = ((i*37 + a*17) % 17 - 8) / 100;  // +/- 8%
  return trend + noise;
};

const COHORTS = [];
for(let i=0;i<N;i++){
  const maxAge = (N-1) - i;
  const row = [];
  for(let a=0;a<=MAXCOL;a++){
    if(a > maxAge){ row.push(null); continue; }
    if(a === 0){ row.push(100); continue; }
    row.push(Math.round(BASE[a] * (1 + jitter(i,a)) * 10) / 10);
  }
  COHORTS.push({ i: I0+i, size: SIZES[i], row, free: FREE.has(I0+i) });
}

/* per-city split of one cohort — counts sum exactly to the cohort's counts */
const CITY_NAMES = ["Austin","Houston","San Antonio","Dallas","Atlanta","OKC","St. Louis"];
const CITY_W = [42,19,18,7,6,4,4];
function splitCounts(total, seed){
  const sum = CITY_W.reduce((a,b)=>a+b,0);
  const raw = CITY_W.map(w => total*w/sum);
  const out = raw.map(Math.floor);
  let short = total - out.reduce((a,b)=>a+b,0);
  const order = raw.map((r,k)=>[r-Math.floor(r),k]).sort((a,b)=>b[0]-a[0]);
  for(let k=0;k<short;k++) out[order[(k+seed) % order.length][1]]++;
  return out;
}

const $ = id => document.getElementById(id);
const state = { year:"all", month:"all", city:"all", open:null };

const visible = () => COHORTS.filter(c => {
  if(state.year !== "all" && Math.floor(c.i/12) !== Number(state.year)) return false;
  if(state.month !== "all" && (c.i%12) !== Number(state.month)) return false;
  return true;
});

/* column mean over visible, non-free cohorts that have an observation */
function colMeans(rows){
  const out = [];
  for(let a=0;a<=MAXCOL;a++){
    const vals = rows.filter(c => !c.free && c.row[a] !== null).map(c => c.row[a]);
    out.push(vals.length ? vals.reduce((x,y)=>x+y,0)/vals.length : null);
  }
  return out;
}
const band = (v, mean) => v === null || mean === null ? "none"
  : Math.abs(v - mean) <= 2 ? "at" : v > mean ? "above" : "below";

function render(){
  const rows = visible();                       // oldest first, as designed
  const means = colMeans(rows);

  $("gridHead").innerHTML = `<tr><th class="cohort-h">Cohort</th>`
    + Array.from({length:MAXCOL+1},(_,a)=>`<th>Month ${a}</th>`).join("") + `</tr>`;

  $("gridBody").innerHTML = rows.map(c => {
    const cells = c.row.map((v,a) =>
      v === null ? `<td class="cell none">—</td>`
                 : `<td class="cell ${band(v,means[a])}" data-i="${c.i}" data-a="${a}"
                      title="${Math.round(c.size*v/100)} of ${c.size} players">${Math.round(v)}%</td>`
    ).join("");
    return `<tr data-row="${c.i}" class="${state.open===c.i?"open":""}">`
      + `<td class="cohort-c"><button class="cname" data-c="${c.i}">${lbl(c.i)}</button>`
      + (c.free ? `<span class="freebadge">free launch</span>` : "")
      + `<div class="cmeta">${c.size.toLocaleString()} players · click for city detail</div></td>`
      + cells + `</tr>`;
  }).join("");

  /* Setting innerHTML on a <tbody> parses in table context, which strips the
     nested table's thead/tbody/tfoot. Build the panel detached and insert it. */
  if(state.open !== null){
    const c = COHORTS.find(x => x.i === state.open);
    const host = $("gridBody").querySelector(`tr[data-row="${state.open}"]`);
    if(host && c){
      const tr = document.createElement("tr");
      tr.className = "detail";
      const td = document.createElement("td");
      td.colSpan = MAXCOL + 2;
      td.innerHTML = detailPanel(c);      // parses outside table context, so the
      tr.appendChild(td);                 // nested thead/tbody/tfoot survive
      host.after(tr);
    }
  }

  const fmt = v => v === null ? "—" : v.toFixed(1) + "%";
  $("gridFoot").innerHTML =
    `<tr><td class="cohort-c"><span class="flabel">Average retention · All Matchday</span>`
    + `<div class="fsub">${rows.filter(c=>!c.free).length} cohorts, free launch excluded</div></td>`
    + means.map(m => `<td>${fmt(m)}</td>`).join("") + `</tr>`;

  $("note1").innerHTML =
    `<b>Shading compares each cell to its own column</b>, not to the rest of its row — so a green Month 6 `
    + `means that cohort held better at six months than other cohorts did at six months. Within two `
    + `percentage points of the column average counts as at average.`;
  $("note2").innerHTML =
    `<b>Apr and May 2023 matches were free.</b> Those cohorts are shown but excluded from the average `
    + `row, because pooling free trials with paid play overstates retention. Every other cohort counts `
    + `at every age it has reached — ${rows.filter(c=>!c.free).length} at Month 1, `
    + `${rows.filter(c=>!c.free&&c.row[MAXCOL]!==null).length} at Month 12.`;

  $("gridBody").querySelectorAll(".cname").forEach(b =>
    b.addEventListener("click", () => {
      state.open = state.open === Number(b.dataset.c) ? null : Number(b.dataset.c);
      render();
    }));
  const close = $("detailClose");
  if(close) close.addEventListener("click", () => { state.open = null; render(); });
}

function detailPanel(c){
  const seed = c.i % 7;
  const sizes = splitCounts(c.size, seed);
  /* Cities alphabetical, as the design has them. Sizes are a partition of the
     cohort — a player has exactly one first-match city — so they sum to the
     cohort size and the All cities row is the cohort's own curve. */
  const cities = CITY_NAMES.map((n,k) => {
    const row = c.row.map((v,a) => {
      if(v === null) return null;
      if(a === 0) return 100;
      return Math.round(v * (1 + ((c.i*13 + k*29 + a*7) % 15 - 7)/100));
    });
    return { n, size: sizes[k], row };
  }).sort((a,b) => a.n.localeCompare(b.n));

  const head = `<tr><th class="dcity">City</th><th class="dsize">Cohort size</th>`
    + Array.from({length:MAXCOL+1},(_,a)=>`<th>M${a}</th>`).join("") + `</tr>`;
  const body = cities.map(ct =>
    `<tr><td class="dcity">${ct.n}</td><td class="dsize">${ct.size.toLocaleString()}</td>`
    + ct.row.map(v => v === null ? `<td class="dnone">—</td>` : `<td>${v}%</td>`).join("")
    + `</tr>`).join("");
  const foot = `<tr class="dall"><td class="dcity">All cities</td>`
    + `<td class="dsize">${c.size.toLocaleString()}</td>`
    + c.row.map(v => v === null ? `<td class="dnone">—</td>` : `<td>${Math.round(v)}%</td>`).join("")
    + `</tr>`;

  const sum = cities.reduce((s,x)=>s+x.size,0);
  return `<div class="detail-inner">
      <div class="detail-head">
        <div><strong>${lbl(c.i)} cohort by city</strong>
          <div class="detail-sub">City-level retention for the selected cohort. Click any cell in the main table to inspect Player ID churn.</div></div>
        <button class="close" id="detailClose">Close</button></div>
      <div class="dwrap"><table class="dt">
        <thead>${head}</thead><tbody>${body}</tbody><tfoot>${foot}</tfoot></table></div>
      <div class="dnote">Every player has one first-match city, so the city sizes are a partition of the
        cohort — ${sum.toLocaleString()} across ${cities.length} markets, equal to the cohort's
        ${c.size.toLocaleString()}. <b>All cities</b> is the cohort's own curve, for comparison.</div>
    </div>`;
}

/* filters */
(function fill(){
  const years = [...new Set(COHORTS.map(c=>Math.floor(c.i/12)))].sort();
  $("cohortYear").innerHTML = `<option value="all">All years</option>`
    + years.map(y=>`<option value="${y}">${y}</option>`).join("");
  $("cohortMonth").innerHTML = `<option value="all">All months</option>`
    + MN.map((m,k)=>`<option value="${k}">${m}</option>`).join("");
  $("cohortCity").innerHTML = `<option value="all">All Matchday</option>`
    + CITY_NAMES.map(c=>`<option>${c}</option>`).join("");
})();
["cohortYear","cohortMonth","cohortCity"].forEach(id =>
  $(id).addEventListener("change", e => {
    state[id.replace("cohort","").toLowerCase()] = e.target.value;
    state.open = null; render();
  }));
render();
</script>
</body></html>
