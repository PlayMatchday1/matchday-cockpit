<style>
*,*::before,*::after{box-sizing:border-box}
:root{--ink:#10231A;--ink2:#3C4F44;--mut:#6E8076;--line:#E4EAE5;--line2:#EFF3EF;--bg:#EDF2ED;
 --hdr:#0F3323;--grn:#4FE07E;--grn-d:#0B7A3E;--grn-soft:#E4FBEC;--org:#E8492A;
 --blu:#2a78d6;--blu-soft:#EFF6FF;--amb:#B8730B;--amb-soft:#FFF6E3;--r:10px}
html,body{margin:0}
body{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);
 background-image:radial-gradient(rgba(16,35,26,.07) 1px,transparent 1px);background-size:22px 22px;
 -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
.top{background:var(--hdr);color:#fff;display:flex;align-items:center;gap:26px;padding:0 26px;height:62px;position:sticky;top:0;z-index:60}
.brand{display:flex;align-items:baseline;gap:7px;font-weight:700}
.brand .m{font-family:"Archivo Black","Arial Black",sans-serif;font-style:italic;font-size:21px;color:var(--grn);letter-spacing:-.5px}
.brand .c{font-style:italic;font-size:14px}
.topnav{display:flex;gap:4px;flex-wrap:wrap}
.topnav a{padding:8px 15px;border-radius:999px;color:#D8E7DE;text-decoration:none;font-weight:600;white-space:nowrap}
.topnav a.on{background:var(--grn);color:#08281A}
.who{margin-left:auto;color:#D8E7DE;font-weight:600}
.shell{display:flex;align-items:flex-start;min-height:calc(100vh - 62px)}
.side{width:220px;flex:0 0 220px;background:#fff;border-right:1px solid var(--line);padding:16px 12px 40px;position:sticky;top:62px;align-self:stretch;height:calc(100vh - 62px);overflow:auto}
.slab{font-size:10.5px;font-weight:700;letter-spacing:.11em;color:#93A49A;padding:14px 12px 7px}
.side a{display:flex;gap:11px;padding:9px 12px;border-radius:9px;text-decoration:none;color:var(--ink2);font-weight:600}
.side a:hover{background:#F4F7F4}
.side a.on{background:var(--grn-soft);color:#0B3D24;font-weight:700}
.side a .ic{width:16px;text-align:center;opacity:.6}
.main{flex:1;min-width:0;padding:22px 26px 70px}
h1{font-family:"Archivo Black","Arial Black",sans-serif;font-size:34px;letter-spacing:-1.1px;margin:0 0 14px;line-height:1}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}

.bar{display:flex;align-items:flex-end;gap:12px;padding:13px 16px;flex-wrap:wrap}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:10px;font-weight:700;letter-spacing:.1em;color:#93A49A}
select,input[type=date]{font:inherit;font-size:13.5px;font-weight:600;color:var(--ink2);border:1px solid var(--line);
 border-radius:8px;padding:8px 11px;background:#fff;min-width:132px}
select:focus,input:focus{outline:2px solid var(--grn);outline-offset:-1px}
.win{display:flex;gap:6px;align-items:center}
.wb{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font:inherit;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer}
.wb:hover{border-color:#CFDCD4}
.wb.on{background:var(--hdr);border-color:var(--hdr);color:#fff}
.spacer{flex:1}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 15px;font:inherit;font-weight:700;font-size:13.5px;color:var(--ink2);cursor:pointer}
.btn:hover{border-color:#CFDCD4}
.btn.p{background:var(--grn);border-color:var(--grn);color:#08281A}

/* tiers */
.tiers{display:grid;grid-template-columns:repeat(auto-fit,minmax(224px,1fr));gap:11px;margin-bottom:12px}
.tier{background:#fff;border:1px solid var(--line);border-left:4px solid var(--line);border-radius:var(--r);
 padding:14px 16px;cursor:pointer;text-align:left;font:inherit;transition:border-color .1s,box-shadow .1s;user-select:none}
.tier:focus-visible{outline:2px solid var(--grn);outline-offset:2px}
.tier:hover{border-color:#CFDCD4}
.tier .k{font-size:10.5px;font-weight:700;letter-spacing:.09em;color:var(--mut);text-transform:uppercase;display:flex;align-items:center;gap:8px}
.tier .v{font-family:"Archivo Black","Arial Black",sans-serif;font-size:32px;letter-spacing:-1.1px;margin-top:5px;line-height:1}
.tier .f{font-size:12.5px;color:var(--mut);margin-top:4px}
.tier.heavy{border-left-color:var(--org)} .tier.heavy .v{color:var(--org)}
.tier.reg{border-left-color:var(--amb)} .tier.tried{border-left-color:#B9C6BE}
.tier.on{box-shadow:0 0 0 2px var(--hdr) inset;border-color:var(--hdr)}
.stepper{display:inline-flex;align-items:center;gap:1px;background:#F2F5F2;border-radius:7px;padding:2px}
.stepper button{border:0;background:#fff;width:20px;height:20px;border-radius:5px;cursor:pointer;font:inherit;font-size:12px;font-weight:700;color:var(--ink2);line-height:1}
.stepper button:hover{background:var(--grn-soft);color:var(--grn-d)}
.stepper b{font-size:12px;padding:0 5px;font-variant-numeric:tabular-nums}

.sum{display:flex;align-items:baseline;gap:14px;padding:13px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.sum .t{font-weight:700;font-size:15.5px}
.sum .s{color:var(--mut);font-size:12.5px}
.sum .tools{margin-left:auto;display:flex;gap:8px}

.thead,.trow{display:grid;grid-template-columns:minmax(168px,1.35fr) minmax(160px,1.2fr) 112px minmax(120px,.95fr) 128px 74px 82px 100px 74px;align-items:center;padding:0 16px}
.thead{background:#F7FAF8;border-bottom:1px solid var(--line)}
.thead div{font-size:10.5px;font-weight:700;letter-spacing:.09em;color:#8C9E93;text-transform:uppercase;padding:10px 7px}
.thead div.r,.trow>div.r{text-align:right}
.trow{border-bottom:1px solid var(--line2)}
.trow:last-child{border-bottom:0}
.trow:hover{background:#FBFDFB}
.trow>div{padding:10px 7px;min-width:0}
.nm{font-weight:700;font-size:14px;display:flex;align-items:center;gap:7px}
.nm small{color:#9FB0A5;font-weight:600;font-size:11.5px}
.pill{border-radius:999px;padding:2px 8px;font-size:10.5px;font-weight:700;letter-spacing:.04em;white-space:nowrap}
.pill.heavy{background:#FDE7E1;color:#A33418}
.pill.reg{background:var(--amb-soft);color:var(--amb)}
.pill.tried{background:#F1F4F1;color:#7C8D83}
.pill.mem{background:var(--grn-soft);color:var(--grn-d)}
.cc{background:#F1F4F1;color:var(--ink2);border-radius:999px;padding:3px 9px;font-size:12px;font-weight:700;white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;display:inline-block}
.fl{font-size:12.5px;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.em{font-size:12.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.em.relay{color:var(--amb);font-weight:600}
.tel{font-size:13px;color:var(--ink2);font-variant-numeric:tabular-nums;white-space:nowrap}
.num{font-weight:700;font-variant-numeric:tabular-nums}
.dt{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.gone{font-variant-numeric:tabular-nums;font-weight:700}
.gone.hot{color:var(--org)}
.foot{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--mut);font-size:12.5px;padding:12px 16px;border-top:1px solid var(--line2)}
.empty{padding:44px;text-align:center;color:var(--mut)}
/* narrow: keep name, how to reach them, and how long gone */
@media(max-width:1280px){.side{display:none}
 .thead,.trow{grid-template-columns:minmax(150px,1.3fr) minmax(150px,1.1fr) 106px 126px 74px 74px}
 .thead div:nth-child(4),.trow>div:nth-child(4),.thead div:nth-child(7),.trow>div:nth-child(7),
 .thead div:nth-child(8),.trow>div:nth-child(8){display:none}}
</style>

const TODAY=DATA.today;
let HEAVY=10, WIN="ytd", TIER=null;
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const money=v=>"$"+v.toLocaleString(undefined,{maximumFractionDigits:0});
const nice=d=>new Date(d+"T12:00:00").toLocaleDateString(undefined,{month:"short",day:"numeric",year:"numeric"});
function winStart(){
  if(WIN==="ytd") return "2026-01-01";
  if(WIN==="12"){const d=new Date(TODAY+"T12:00:00");d.setFullYear(d.getFullYear()-1);return d.toISOString().slice(0,10)}
  return "0000-01-01";
}
function tierOf(m){return m>=HEAVY?"heavy":m>=3?"reg":"tried"}
const TIERS=[
 {k:"heavy",lab:"Heavy",   foot:"played a lot, then stopped"},
 {k:"reg",  lab:"Regular", foot:"3 to 0 matches"},
 {k:"tried",lab:"Tried it",foot:"one or two matches, then gone"},
];
function base(){
  const gone=+fGone.value, after=fAfter.value||winStart();
  return DATA.rows.filter(r=>
    (fCity.value==="All cities"||r.city===fCity.value) &&
    (fField.value==="All fields"||r.field===fField.value) &&
    r.days>=gone && r.last>=after);
}
function render(){
  const list0=base();
  const counts={heavy:0,reg:0,tried:0}, spend={heavy:0,reg:0,tried:0};
  list0.forEach(r=>{const t=tierOf(r.matches);counts[t]++;spend[t]+=r.spend});
  TIERS[1].foot=`3 to ${HEAVY-1} matches`;

  document.getElementById("tiers").innerHTML=TIERS.map(t=>`
    <div class="tier ${t.k} ${TIER===t.k?"on":""}" role="button" tabindex="0"
         onclick="pick('${t.k}')" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();pick('${t.k}')}">
      <div class="k">${esc(t.lab)}
        ${t.k==="heavy"?`<span class="stepper" onclick="event.stopPropagation()">
          <button onclick="bump(-1)" aria-label="Lower">−</button><b id="hv">${HEAVY}+</b><button onclick="bump(1)" aria-label="Raise">+</button></span>`:""}
      </div>
      <div class="v">${counts[t.k].toLocaleString()}</div>
      <div class="f">${esc(t.k==="heavy"?`${HEAVY}+ matches · ${money(spend.heavy)} spent between them`:t.foot)}</div>
    </div>`).join("");

  const list=(TIER?list0.filter(r=>tierOf(r.matches)===TIER):list0).slice().sort((a,b)=>b.matches-a.matches);
  const after=fAfter.value||winStart();
  document.getElementById("sumT").textContent =
    TIER?`${list.length.toLocaleString()} ${TIERS.find(t=>t.k===TIER).lab.toLowerCase()} players who stopped`
        :`${list.length.toLocaleString()} players who stopped`;
  document.getElementById("sumS").textContent =
    `last played between ${nice(after)} and ${nice(new Date(new Date(TODAY+"T12:00:00")-fGone.value*864e5).toISOString().slice(0,10))} · sorted by matches played`;

  document.getElementById("rows").innerHTML = !list.length
    ? '<div class="empty">Nobody matches those filters.</div>'
    : list.slice(0,60).map(r=>{
      const t=tierOf(r.matches);
      return `<div class="trow">
        <div><div class="nm">${esc(r.name)}
          <span class="pill ${t}">${t==="heavy"?"HEAVY":t==="reg"?"REGULAR":"TRIED IT"}</span>
          ${r.member?'<span class="pill mem">MEMBER</span>':""}</div></div>
        <div>${r.relay?'<span class="em relay">Apple private relay</span>':'<span class="em">'+esc(r.email)+'</span>'}</div>
        <div><span class="cc">${esc(r.city)}</span></div>
        <div class="fl">${esc(r.field)}</div>
        <div class="tel">${esc(r.phone)}</div>
        <div class="r num">${r.matches}</div>
        <div class="r num">${money(r.spend)}</div>
        <div class="r dt">${nice(r.last)}</div>
        <div class="r gone ${r.days>=270?"hot":""}">${r.days}d</div>
      </div>`}).join("");
  document.getElementById("footL").textContent =
    list.length>60?`Showing the top 60 of ${list.length.toLocaleString()} — the CSV has all of them`
                  :`${list.length.toLocaleString()} shown · every one has a phone number`;
  const lost=list.reduce((s,r)=>s+r.spend,0);
  document.getElementById("footR").textContent=`${money(lost)} spent by these players before they stopped`;
}
function pick(k){TIER=TIER===k?null:k;render()}
function bump(d){HEAVY=Math.max(3,Math.min(50,HEAVY+d));render()}
function setWin(w){WIN=w;fAfter.value="";
  document.querySelectorAll(".wb").forEach(b=>b.classList.toggle("on",b.dataset.w===w));render()}
function flash(b,m){const o=b.textContent;b.textContent=m;b.disabled=true;setTimeout(()=>{b.textContent=o;b.disabled=false},1300)}
function opt(id,arr,val){document.getElementById(id).innerHTML=arr.map(v=>
  typeof v==="object"?`<option value="${v.v}"${v.v===val?" selected":""}>${esc(v.t)}</option>`
                     :`<option${v===val?" selected":""}>${esc(v)}</option>`).join("")}
opt("fCity",["All cities",...DATA.cities],"All cities");
opt("fField",["All fields",...DATA.fields],"All fields");
opt("fGone",[{v:30,t:"30 days"},{v:60,t:"60 days"},{v:90,t:"90 days"},{v:180,t:"180 days"}],90);
["fCity","fField","fGone"].forEach(id=>document.getElementById(id).addEventListener("change",render));
document.getElementById("fAfter").addEventListener("change",()=>{
  document.querySelectorAll(".wb").forEach(b=>b.classList.remove("on"));render()});
render();

</script>
