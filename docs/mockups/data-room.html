<title>Player Data Room — Clubhouse</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,400;0,500;0,600;0,700;1,700&family=Archivo+Black&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box}
:root{--ink:#10231A;--ink2:#3C4F44;--mut:#6E8076;--line:#E4EAE5;--line2:#EFF3EF;--bg:#EDF2ED;
 --hdr:#0F3323;--grn:#4FE07E;--grn-d:#0B7A3E;--grn-soft:#E4FBEC;--org:#E8492A;
 --blu:#2a78d6;--blu-soft:#EFF6FF;--amb:#B8730B;--amb-soft:#FFF6E3;--r:10px}
html,body{margin:0}
body{font-family:Archivo,"Helvetica Neue",Arial,sans-serif;color:var(--ink);background:var(--bg);
 background-image:radial-gradient(rgba(16,35,26,.07) 1px,transparent 1px);background-size:22px 22px;
 -webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45}
.top{background:var(--hdr);color:#fff;display:flex;align-items:center;gap:26px;padding:0 26px;height:62px;position:sticky;top:0;z-index:80}
.brand{display:flex;align-items:baseline;gap:7px;font-weight:700}
.brand .m{font-family:"Archivo Black","Arial Black",sans-serif;font-style:italic;font-size:21px;color:var(--grn);letter-spacing:-.5px}
.brand .c{font-style:italic;font-size:14px}
.topnav{display:flex;gap:4px;flex-wrap:wrap}
.topnav a{padding:8px 15px;border-radius:999px;color:#D8E7DE;text-decoration:none;font-weight:600;white-space:nowrap}
.topnav a.on{background:var(--grn);color:#08281A}
.who{margin-left:auto;color:#D8E7DE;font-weight:600}
.shell{display:flex;align-items:flex-start;min-height:calc(100vh - 62px)}
.side{width:220px;flex:0 0 220px;background:#fff;border-right:1px solid var(--line);padding:16px 12px 40px;position:sticky;top:62px;align-self:stretch;height:calc(100vh - 62px);overflow:auto}
.slab{font-size:10.5px;font-weight:700;letter-spacing:.11em;color:#93A49A;padding:14px 12px 7px}
.side a{display:flex;gap:11px;padding:9px 12px;border-radius:9px;text-decoration:none;color:var(--ink2);font-weight:600}
.side a:hover{background:#F4F7F4}
.side a.on{background:var(--grn-soft);color:#0B3D24;font-weight:700}
.side a .ic{width:16px;text-align:center;opacity:.6}
.main{flex:1;min-width:0;padding:20px 24px 70px}
h1{font-family:"Archivo Black","Arial Black",sans-serif;font-size:32px;letter-spacing:-1px;margin:0 0 14px;line-height:1}
.card{background:#fff;border:1px solid var(--line);border-radius:var(--r);margin-bottom:12px}

/* ── the builder: one compact strip, not three tall boxes ── */
.build{display:flex;align-items:center;gap:8px;padding:11px 14px;flex-wrap:wrap}
.build + .build{border-top:1px solid var(--line2)}
.zl{font-size:10px;font-weight:700;letter-spacing:.1em;color:#93A49A;text-transform:uppercase;margin-right:2px}
.zone{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:3px;border-radius:9px;min-height:34px}
.zone.drop{outline:2px dashed #BDEBD1;background:var(--grn-soft)}
.fld{display:inline-flex;align-items:center;gap:7px;background:var(--grn-soft);border:1px solid #BDEBD1;color:#0B3D24;
 border-radius:8px;padding:5px 8px 5px 11px;font-weight:700;font-size:13px;cursor:grab;user-select:none;white-space:nowrap}
.fld.v{background:var(--blu-soft);border-color:#BBD6F6;color:#12406F}
.fld .x{border:0;background:none;font:inherit;color:inherit;opacity:.5;cursor:pointer;padding:0 1px;line-height:1}
.fld .x:hover{opacity:1}
.fld select{appearance:none;border:0;background:rgba(255,255,255,.7);border-radius:5px;font:inherit;font-size:12px;font-weight:700;color:inherit;padding:2px 6px;cursor:pointer}
.add{border:1px dashed #CFDCD4;background:#fff;border-radius:8px;padding:5px 11px;font:inherit;font-size:13px;font-weight:700;color:var(--mut);cursor:pointer}
.add:hover{border-color:var(--grn-d);color:var(--grn-d)}
.swap{margin-left:2px;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font:inherit;font-size:13px;font-weight:700;color:var(--ink2);cursor:pointer}
.swap:hover{border-color:#CFDCD4;background:#FAFCFA}
.sel{border:1px solid var(--line);border-radius:8px;padding:6px 9px;font:inherit;font-size:13px;font-weight:600;color:var(--ink2);background:#fff}
.spacer{flex:1}
.pre{border:1px solid var(--line);background:#fff;border-radius:999px;padding:5px 13px;font:inherit;font-size:12.5px;font-weight:600;color:var(--ink2);cursor:pointer;white-space:nowrap}
.pre:hover{border-color:#CFDCD4}
.pre.on{background:var(--hdr);border-color:var(--hdr);color:#fff}

/* ── the table ── */
.thead2{display:flex;align-items:baseline;gap:12px;padding:13px 16px 11px;border-top:1px solid var(--line);flex-wrap:wrap}
.ttl{font-weight:700;font-size:16px;letter-spacing:-.25px}
.tsub{color:var(--mut);font-size:12.5px}
.tools{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 14px;font:inherit;font-weight:700;font-size:13px;color:var(--ink2);cursor:pointer}
.btn:hover{border-color:#CFDCD4}
.btn.p{background:var(--grn);border-color:var(--grn);color:#08281A}
.gwrap{overflow:auto;max-height:62vh;border-top:1px solid var(--line)}
table.pv{border-collapse:separate;border-spacing:0;width:100%;font-variant-numeric:tabular-nums}
table.pv th,table.pv td{padding:8px 12px;white-space:nowrap;border-bottom:1px solid var(--line2)}
table.pv thead th{background:#F7FAF8;font-size:10.5px;letter-spacing:.09em;color:#8C9E93;text-transform:uppercase;
 text-align:right;position:sticky;top:0;z-index:3;border-bottom:1px solid var(--line)}
table.pv thead th:first-child{text-align:left;left:0;z-index:5}
table.pv tbody th{text-align:left;font-weight:700;font-size:13.5px;background:#fff;position:sticky;left:0;z-index:2}
table.pv td{text-align:right;font-size:13.5px}
table.pv td.n{color:#C3CFC7}
table.pv td button{border:0;background:none;font:inherit;font-size:13.5px;font-variant-numeric:tabular-nums;color:var(--ink);cursor:pointer;padding:3px 6px;border-radius:5px;width:100%;text-align:right;font-weight:600}
table.pv td button:hover{outline:2px solid var(--blu);outline-offset:-2px}
table.pv td.sel button{outline:2px solid var(--blu);outline-offset:-2px}
table.pv .rt,table.pv thead th.rt{background:#F7FAF8;font-weight:700;position:sticky;right:0;z-index:2}
table.pv thead th.rt{z-index:4}
table.pv tfoot th,table.pv tfoot td{background:var(--hdr);color:#fff;font-weight:700;border-bottom:0;position:sticky;bottom:0;z-index:3}
table.pv tfoot th{left:0;z-index:5;text-align:left}
.heat{display:flex;align-items:center;gap:8px;padding:10px 16px;border-top:1px solid var(--line2);color:var(--mut);font-size:12px;flex-wrap:wrap}
.ramp{display:flex;gap:2px}.ramp i{width:22px;height:11px;border-radius:2px;display:block}
.note{padding:10px 16px;border-top:1px solid var(--line2);color:var(--mut);font-size:12.5px}
.note b{color:var(--ink2)}

/* ── drill-down ── */
.drill{position:fixed;top:62px;right:0;bottom:0;width:min(560px,92vw);background:#fff;border-left:1px solid var(--line);
 box-shadow:-14px 0 34px rgba(16,35,26,.13);transform:translateX(100%);transition:transform .18s ease;z-index:70;display:flex;flex-direction:column}
.drill.on{transform:none}
.dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.dh .t{font-weight:700;font-size:16px}.dh .s{color:var(--mut);font-size:12.5px;margin-top:2px}
.dx{margin-left:auto;border:1px solid var(--line);background:#fff;border-radius:8px;width:30px;height:30px;cursor:pointer;color:var(--mut);font-size:15px;line-height:1}
.dbody{flex:1;overflow:auto}
.prow{display:grid;grid-template-columns:1fr 118px 62px;gap:8px;align-items:center;padding:10px 18px;border-bottom:1px solid var(--line2)}
.prow .nm{font-weight:700;font-size:13.5px}
.prow .em{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prow .em.relay{color:var(--amb);font-weight:600}
.prow .tel{font-size:12.5px;color:var(--ink2)}
.prow .r{text-align:right;font-weight:700;font-variant-numeric:tabular-nums}
.dfoot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:9px;align-items:center}
.dfoot .c{color:var(--mut);font-size:12.5px;margin-right:auto}
@media(max-width:1150px){.side{display:none}}
</style>

  <main class="main">
    <h1>PLAYER DATA ROOM</h1>

    <div class="card">
      <div class="build">
        <span class="zl">Rows</span><div class="zone" id="zRows" data-zone="rows"></div>
        <button class="add" onclick="openAdd('rows',this)">+</button>
        <button class="swap" onclick="swap()" title="Swap rows and columns">⇄ Swap</button>
        <span class="zl" style="margin-left:10px">Columns</span><div class="zone" id="zCols" data-zone="cols"></div>
        <button class="add" onclick="openAdd('cols',this)">+</button>
        <span class="zl" style="margin-left:10px">Values</span><div class="zone" id="zVals" data-zone="vals"></div>
        <button class="add" onclick="openAdd('vals',this)">+</button>
      </div>
      <div class="build">
        <span class="zl">Filter</span>
        <select class="sel" id="fFrom"></select><span style="color:#93A49A">to</span><select class="sel" id="fTo"></select>
        <select class="sel" id="fCity"></select>
        <select class="sel" id="fField"></select>
        <span class="spacer"></span>
        <button class="pre" onclick="preset(0)">Players by city by month</button>
        <button class="pre" onclick="preset(1)">Spots per player by field</button>
        <button class="pre" onclick="preset(2)">Revenue by cohort year</button>
      </div>

      <div class="thead2">
        <div><div class="ttl" id="ttl">—</div><div class="tsub" id="tsub"></div></div>
        <div class="tools">
          <button class="btn" onclick="flash(this,'Copied')">Copy</button>
          <button class="btn p" onclick="flash(this,'Exported')">Export CSV</button>
        </div>
      </div>

      <div class="gwrap"><table class="pv" id="pv"></table></div>

    </div>
  </main>
</div>

<div class="drill" id="drill">
  <div class="dh">
    <div><div class="t" id="dTitle">—</div><div class="s" id="dSub"></div></div>
    <button class="dx" onclick="closeDrill()" aria-label="Close">×</button>
  </div>
  <div class="dbody" id="dBody"></div>
  <div class="dfoot"><span class="c" id="dCount"></span>
    <button class="btn" onclick="flash(this,'Copied')">Copy phones</button>
    <button class="btn p" onclick="flash(this,'Exported')">Export these</button></div>
</div>

","Westlake","Tomball","Katy Sports Park","Pearland","Lowell H. Strike","Crossbar Rowlett","PRUMC","Lou Fusz Outdoor","Helix Park"],"fieldShare":{"NEMP":0.119,"Onion Creek":0.208,"PARMER Stadium":0.157,"Round Rock":0.225,"Westlake":0.231,"Tomball":0.069,"Katy Sports Park":0.054,"Pearland":0.293,"Lowell H. Strike":0.125,"Crossbar Rowlett":0.118,"PRUMC":0.339,"Lou Fusz Outdoor":0.186,"Helix Park":0.293}};
const DIMS={city:"City",month:"Month",field:"Field",year:"Year",cohort:"Cohort year"};
const PLURAL={city:"cities",month:"months",field:"fields",year:"years",cohort:"cohort years"};
const MEASURES={players:"Players",newp:"New players",spots:"Spots booked",revenue:"Revenue",matches:"Matches"};
const AGGS={count:"Count",sum:"Sum",avg:"Average"};
// Sequential blue, light -> dark. One hue, never a rainbow. Text stays dark, so the
// ramp stops well before the point where it would need light type.
const RAMP=["#ffffff","#e8f1fd","#cde2fb","#b7d3f6","#9ec5f4","#86b6ef","#6da7ec"];
let S={rows:["city"],cols:["month"],vals:[{m:"players",a:"count"}]};
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmt=(v,m)=>v==null?null:(m==="revenue"?"$"+v.toLocaleString(undefined,{maximumFractionDigits:0}):v.toLocaleString());

/* ---------- the cube: one pass over the grid, memoised ---------- */
const CACHE=new Map();
function cube(){
  const key=JSON.stringify(S)+fFrom.value+fTo.value+fCity.value+fField.value;
  if(CACHE.has(key)) return CACHE.get(key);
  const M=DATA.months, mi=M.indexOf(fFrom.value), mj=M.indexOf(fTo.value);
  const months=M.slice(Math.min(mi,mj),Math.max(mi,mj)+1);
  const cities=(fCity.value==="All cities"?DATA.cities:[fCity.value]).slice().sort();
  const measure=S.vals[0].m, agg=S.vals[0].a;
  // scale the base player counts into whatever measure is asked for, deterministically
  const k={players:1,newp:.31,spots:2.6,revenue:15.4,matches:1.9}[measure];
  const rowKeys = S.rows[0]==="city"?cities : S.rows[0]==="month"?months : DATA.fieldList;
  const colKeys = !S.cols.length?[] : S.cols[0]==="month"?months : S.cols[0]==="city"?cities : DATA.fieldList;
  const at=(r,c)=>{
    const city = S.rows[0]==="city"?r : S.cols[0]==="city"?c : null;
    const mon  = S.rows[0]==="month"?r : S.cols[0]==="month"?c : null;
    let base;
    if(city&&mon){ base=DATA.grid[city][M.indexOf(mon)]; }
    else if(city){ base=months.reduce((s,m)=>s+(DATA.grid[city][M.indexOf(m)]||0),0)||null; }
    else if(mon){ base=cities.reduce((s,c2)=>s+(DATA.grid[c2][M.indexOf(mon)]||0),0)||null; }
    else { base=cities.reduce((s,c2)=>s+months.reduce((t,m)=>t+(DATA.grid[c2][M.indexOf(m)]||0),0),0)||null; }
    if(base==null) return null;
    // a field-keyed axis splits its city's figure across that city's fields
    const fieldKey = S.rows[0]==="field"?r : S.cols[0]==="field"?c : null;
    if(fieldKey){ const share=DATA.fieldShare[fieldKey]||.2; base=Math.round(base*share); }
    let v=base*k;
    if(agg==="avg") v=v/Math.max(1,base);
    return measure==="revenue"?Math.round(v):Math.round(v);
  };
  const cells=rowKeys.map(r=>colKeys.length?colKeys.map(c=>at(r,c)):[at(r,null)]);
  const out={rowKeys,colKeys,cells,measure,agg,months,cities};
  CACHE.set(key,out); return out;
}

/* ---------- render ---------- */
function chips(zone,list){
  const box=document.getElementById(zone==="rows"?"zRows":zone==="cols"?"zCols":"zVals");
  box.innerHTML=list.map((d,i)=>{
    if(zone==="vals") return `<span class="fld v" draggable="true" data-z="vals" data-i="${i}">${esc(MEASURES[d.m])}
      <select onchange="setAgg(${i},this.value)" onclick="event.stopPropagation()">${Object.entries(AGGS).map(([k,t])=>`<option value="${k}"${k===d.a?" selected":""}>${t}</option>`).join("")}</select>
      <button class="x" onclick="drop('vals',${i})" aria-label="Remove">×</button></span>`;
    return `<span class="fld" draggable="true" data-z="${zone}" data-i="${i}">${esc(DIMS[d])}
      <button class="x" onclick="drop('${zone}',${i})" aria-label="Remove">×</button></span>`;
  }).join("") || `<span style="color:#B9C6BE;font-size:13px;padding:0 4px">none</span>`;
}
function render(){
  chips("rows",S.rows);chips("cols",S.cols);chips("vals",S.vals);
  const q=cube(), m=q.measure, a=q.agg;
  const flat=q.cells.flat().filter(v=>v!=null);
  const lo=Math.min(...flat,0), hi=Math.max(...flat,1);
  const shade=v=>v==null?"":RAMP[Math.min(RAMP.length-1,Math.round((v-lo)/(hi-lo||1)*(RAMP.length-1)))];

  document.getElementById("ttl").textContent =
    `${AGGS[a]} of ${MEASURES[m]} by ${DIMS[S.rows[0]]}${S.cols.length?" across "+DIMS[S.cols[0]]:""}`;
  const total=flat.reduce((s,v)=>s+v,0);
  document.getElementById("tsub").textContent =
    `${fmt(total,m)} · ${fFrom.value} – ${fTo.value} · ${q.rowKeys.length} rows`;

  let h='<thead><tr><th>'+esc(DIMS[S.rows[0]])+'</th>'
    + q.colKeys.map(c=>`<th>${esc(c)}</th>`).join("")
    + `<th class="rt">${esc(fFrom.value)} – ${esc(fTo.value)}</th></tr></thead><tbody>`;
  q.rowKeys.forEach((r,ri)=>{
    const row=q.cells[ri], rt=row.reduce((s,v)=>s+(v||0),0);
    h+=`<tr><th>${esc(r)}</th>`+row.map((v,ci)=>v==null?'<td class="n">—</td>'
      :`<td style="background:${shade(v)}"><button data-r="${ri}" data-c="${ci}" onclick="drill(${ri},${ci})">${fmt(v,m)}</button></td>`).join("")
      +`<td class="rt">${rt?fmt(rt,m):"—"}</td></tr>`;
  });
  const colT=(q.colKeys.length?q.colKeys:[0]).map((_,ci)=>q.cells.reduce((s,row)=>s+(row[ci]||0),0));
  h+='</tbody><tfoot><tr><th>All '+esc(PLURAL[S.rows[0]])+'</th>'
    + colT.map(v=>`<td>${fmt(v,m)}</td>`).join("")
    + `<td>${fmt(colT.reduce((a2,b)=>a2+b,0),m)}</td></tr></tfoot>`;
  document.getElementById("pv").innerHTML=h;



}

/* ---------- edit ---------- */
function drop(z,i){ if(z==="rows"&&S.rows.length===1) return; S[z].splice(i,1); CACHE.clear(); render(); }
function setAgg(i,v){ S.vals[i].a=v; CACHE.clear(); render(); }
function swap(){ const r=S.rows; S.rows=S.cols.length?S.cols:["city"]; S.cols=r; CACHE.clear(); render(); }
function openAdd(zone,btn){
  const opts = zone==="vals" ? Object.entries(MEASURES) : Object.entries(DIMS);
  const used = zone==="vals" ? S.vals.map(v=>v.m) : S[zone];
  const free = opts.filter(([k])=>!used.includes(k) && !(zone!=="vals" && (S.rows.includes(k)||S.cols.includes(k))));
  if(!free.length) return;
  const [k]=free[0];
  if(zone==="vals"){ S.vals=[{m:k,a:"count"}]; } else if(zone==="cols"){ S.cols=[k]; } else { S.rows=[k]; }
  CACHE.clear(); render();
}
const PRESETS=[
  {rows:["city"],cols:["month"],vals:[{m:"players",a:"count"}]},
  {rows:["field"],cols:[],      vals:[{m:"spots",a:"avg"}]},
  {rows:["cohort"],cols:[],     vals:[{m:"revenue",a:"sum"}]},
];
function preset(i){ S=JSON.parse(JSON.stringify(PRESETS[i]));
  document.querySelectorAll(".pre").forEach((b,j)=>b.classList.toggle("on",j===i));
  CACHE.clear(); render(); }

/* ---------- drill-down ---------- */
function drill(ri,ci){
  const q=cube(), r=q.rowKeys[ri], c=q.colKeys[ci], v=q.cells[ri][ci];
  document.querySelectorAll("#pv td.sel").forEach(t=>t.classList.remove("sel"));
  const btn=document.querySelector(`#pv td button[data-r="${ri}"][data-c="${ci}"]`);
  if(btn) btn.parentElement.classList.add("sel");
  const city = S.rows[0]==="city"?r : S.cols[0]==="city"?c : null;
  let list=DATA.people.filter(p=>!city||p.city===city).sort((a,b)=>b.matches-a.matches);
  document.getElementById("dTitle").textContent=`${fmt(v,q.measure)} ${MEASURES[q.measure].toLowerCase()}`;
  document.getElementById("dSub").textContent=[r,c].filter(Boolean).join(" · ");
  document.getElementById("dBody").innerHTML=list.map(p=>`<div class="prow">
    <div><div class="nm">${esc(p.name)}</div>${p.relay?'<div class="em relay">Apple private relay</div>':'<div class="em">'+esc(p.email)+'</div>'}</div>
    <div class="tel">${esc(p.phone)}</div><div class="r">${p.matches||"—"}</div></div>`).join("")
    || '<div style="padding:34px;text-align:center;color:#6E8076">No players in this cell.</div>';
  document.getElementById("dCount").textContent=`${list.length} of ${fmt(v,q.measure)} shown in this mockup · every one has a phone`;
  document.getElementById("drill").classList.add("on");
}
function closeDrill(){document.getElementById("drill").classList.remove("on");
  document.querySelectorAll("#pv td.sel").forEach(t=>t.classList.remove("sel"));}
function flash(b,m){const o=b.textContent;b.textContent=m;b.disabled=true;setTimeout(()=>{b.textContent=o;b.disabled=false},1300)}

/* ---------- filters ---------- */
function opt(id,arr,val){document.getElementById(id).innerHTML=arr.map(v=>`<option${v===val?" selected":""}>${esc(v)}</option>`).join("")}
opt("fFrom",DATA.months,DATA.months[0]);
opt("fTo",DATA.months,DATA.months[DATA.months.length-1]);
opt("fCity",["All cities",...DATA.cities],"All cities");
opt("fField",["All fields",...DATA.fieldList],"All fields");
["fFrom","fTo","fCity","fField"].forEach(id=>document.getElementById(id).addEventListener("change",()=>{CACHE.clear();render()}));

/* ---------- drag between zones ---------- */
document.addEventListener("dragstart",e=>{const f=e.target.closest(".fld");if(!f)return;
  e.dataTransfer.setData("text/plain",JSON.stringify({z:f.dataset.z,i:+f.dataset.i}))});
document.querySelectorAll(".zone").forEach(z=>{
  z.addEventListener("dragover",e=>{e.preventDefault();z.classList.add("drop")});
  z.addEventListener("dragleave",()=>z.classList.remove("drop"));
  z.addEventListener("drop",e=>{e.preventDefault();z.classList.remove("drop");
    const {z:from,i}=JSON.parse(e.dataTransfer.getData("text/plain")), to=z.dataset.zone;
    if(from===to||from==="vals"||to==="vals")return;
    const moved=S[from][i]; S[from].splice(i,1); S[to]=[moved];
    if(!S.rows.length)S.rows=["city"];
    CACHE.clear();render();});
});
document.querySelectorAll(".pre")[0].classList.add("on");
render();

</script>
